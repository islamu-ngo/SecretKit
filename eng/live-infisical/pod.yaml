# Developer-only Podman template; render through sandbox.sh, not directly.
apiVersion: v1
kind: Pod
metadata:
  name: __OWNER__
  labels:
    secretkit-sdk-owned: "true"
    secretkit-sdk-lifecycle: live-infisical-v1
spec:
  restartPolicy: Never
  containers:
    - name: __OWNER__-app
      # Infisical v0.167.12, linux/amd64 manifest.
      image: docker.io/infisical/infisical@sha256:44cf26b0b556bc340fd6f86c17404a2ae9ed73e783d3dcd3a53977c54c9c5e83
      ports:
        - containerPort: 8080
          hostIP: 127.0.0.1
          hostPort: __PORT__
          protocol: TCP
      env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8080"
        - name: SITE_URL
          value: "http://127.0.0.1:__PORT__"
        - name: ALLOW_INTERNAL_IP_CONNECTIONS
          value: "true"
        - name: TELEMETRY_ENABLED
          value: "false"
        - name: DISABLE_UPDATE_CHECK
          value: "true"
        - name: ENCRYPTION_KEY
          value: "__ENCRYPTION_KEY__"
        - name: AUTH_SECRET
          value: "__AUTH_SECRET__"
        - name: DB_CONNECTION_URI
          value: "postgresql://infisical:__DB_PASSWORD__@127.0.0.1:5432/infisical"
        - name: REDIS_URL
          value: "redis://127.0.0.1:6379"
    - name: __OWNER__-postgres
      # PostgreSQL 16.14-alpine index.
      image: docker.io/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
      args: ["postgres", "-c", "listen_addresses=127.0.0.1"]
      env:
        - name: POSTGRES_DB
          value: infisical
        - name: POSTGRES_USER
          value: infisical
        - name: POSTGRES_PASSWORD
          value: "__DB_PASSWORD__"
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
    - name: __OWNER__-redis
      # Redis 7.4.9-alpine index.
      image: docker.io/library/redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
      args: ["redis-server", "--bind", "127.0.0.1"]
      volumeMounts:
        - name: redis-data
          mountPath: /data
  volumes:
    - name: postgres-data
      emptyDir: {}
    - name: redis-data
      emptyDir: {}
