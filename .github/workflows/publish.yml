{
  "name": "Protected exact-artifact publication",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "source_run_id": {
          "description": "Successful trusted verify.yml run ID",
          "required": true,
          "type": "string"
        },
        "artifact_id": {
          "description": "Immutable verified family artifact ID",
          "required": true,
          "type": "string"
        },
        "manifest_sha256": {
          "description": "Reviewed manifest SHA-256, also required in protected variables",
          "required": true,
          "type": "string"
        },
        "journal_run_id": {
          "description": "Previous publication run for approved checkpoint (empty only for new family)",
          "required": false,
          "type": "string"
        },
        "journal_artifact_id": {
          "description": "Latest approved immutable journal artifact ID",
          "required": false,
          "type": "string"
        },
        "mode": {
          "description": "Protected operation purpose; observation never publishes",
          "required": true,
          "type": "choice",
          "options": [
            "initial-admission",
            "read-only-recovery",
            "publish-one"
          ],
          "default": "initial-admission"
        },
        "package_id": {
          "description": "Exact approved pending member for publish-one",
          "required": true,
          "type": "choice",
          "options": [
            "SecretKit.Core",
            "SecretKit.Infisical",
            "SecretKit.AzureKeyVault",
            "SecretKit.Extensions.Configuration",
            "SecretKit.Extensions.Hosting",
            "SecretKit.Infisical.Management",
            "SecretKit.AzureKeyVault.Management"
          ]
        },
        "execute": {
          "description": "Explicit single-package mutation authority",
          "required": true,
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "secretkit-nuget-publication",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "outputs": {
        "runner_artifact_id": "${{ steps.runner_upload.outputs.artifact-id }}",
        "runner_sha256": "${{ steps.runner_hash.outputs.sha256 }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9",
          "with": {
            "dotnet-version": "10.0.302"
          }
        },
        {
          "name": "Locked restore and focused build",
          "run": "dotnet restore tests/SecretKit.Release.Tests/SecretKit.Release.Tests.csproj --locked-mode\ndotnet build tests/SecretKit.Release.Tests/SecretKit.Release.Tests.csproj --configuration Release --no-restore"
        },
        {
          "name": "Test and validate actual workflow machine values",
          "run": "dotnet tests/SecretKit.Release.Tests/bin/Release/net10.0/SecretKit.Release.Tests.dll --minimum-expected-tests 1\ndotnet tools/SecretKit.Release/bin/Release/net10.0/SecretKit.Release.dll workflow-check .github/workflows/publish.yml\ndotnet format tools/SecretKit.Release/SecretKit.Release.csproj --verify-no-changes --no-restore --verbosity quiet\ndotnet format tests/SecretKit.Release.Tests/SecretKit.Release.Tests.csproj --verify-no-changes --no-restore --verbosity quiet"
        },
        {
          "id": "runner_hash",
          "name": "Freeze verified release runner without rebuilding packages",
          "run": "tar -C tools/SecretKit.Release/bin/Release/net10.0 -cf runner.tar .\nread -r digest _ < <(sha256sum runner.tar)\nprintf \"sha256=%s\\n\" \"$digest\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "id": "runner_upload",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "release-runner-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "runner.tar",
            "if-no-files-found": "error"
          }
        }
      ],
      "defaults": {
        "run": {
          "shell": "bash"
        }
      }
    },
    "observe": {
      "needs": "verify",
      "if": "${{ (inputs.mode == 'initial-admission' || inputs.mode == 'read-only-recovery') && github.repository == 'islamu-ngo/SecretKit' && github.ref == 'refs/heads/main' && github.ref_protected }}",
      "environment": "release",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "env": {
        "SECRETKIT_APPROVED_MANIFEST_SHA256": "${{ vars.SECRETKIT_APPROVED_MANIFEST_SHA256 }}",
        "SECRETKIT_APPROVED_SOURCE_COMMIT": "${{ vars.SECRETKIT_APPROVED_SOURCE_COMMIT }}",
        "SECRETKIT_APPROVED_VERSION": "${{ vars.SECRETKIT_APPROVED_VERSION }}",
        "SECRETKIT_APPROVED_SOURCE_RUN_ID": "${{ vars.SECRETKIT_APPROVED_SOURCE_RUN_ID }}",
        "SECRETKIT_APPROVED_ARTIFACT_ID": "${{ vars.SECRETKIT_APPROVED_ARTIFACT_ID }}",
        "SECRETKIT_APPROVED_ARTIFACT_DIGEST": "${{ vars.SECRETKIT_APPROVED_ARTIFACT_DIGEST }}",
        "SECRETKIT_APPROVED_SCOPE_SHA256": "${{ vars.SECRETKIT_APPROVED_SCOPE_SHA256 }}",
        "SECRETKIT_APPROVED_EVIDENCE_SHA256": "${{ vars.SECRETKIT_APPROVED_EVIDENCE_SHA256 }}",
        "SECRETKIT_EVIDENCE_DIRECTORY": "independent-evidence",
        "SECRETKIT_NUGET_USER": "${{ vars.SECRETKIT_NUGET_USER }}",
        "SECRETKIT_NUGET_OWNER": "${{ vars.SECRETKIT_NUGET_OWNER }}",
        "SECRETKIT_NUGET_REPOSITORY_CERT_SHA256": "${{ vars.SECRETKIT_NUGET_REPOSITORY_CERT_SHA256 }}",
        "SECRETKIT_APPROVED_JOURNAL_HEAD": "${{ vars.SECRETKIT_APPROVED_JOURNAL_HEAD }}",
        "SECRETKIT_ENVIRONMENT_PROTECTED": "${{ vars.SECRETKIT_ENVIRONMENT_PROTECTED }}",
        "SECRETKIT_ENVIRONMENT": "release",
        "SECRETKIT_ORIGINAL_ADMISSION_FILE": "authorization/original-admission.json",
        "SECRETKIT_APPROVED_ORIGINAL_ADMISSION_SHA256": "${{ vars.SECRETKIT_APPROVED_ORIGINAL_ADMISSION_SHA256 }}",
        "SECRETKIT_VERIFY_PURPOSE": "${{ inputs.mode }}"
      },
      "steps": [
        {
          "id": "input_gate",
          "name": "Bind inputs to protected approvals",
          "env": {
            "SOURCE_RUN": "${{ inputs.source_run_id }}",
            "ARTIFACT": "${{ inputs.artifact_id }}",
            "MANIFEST": "${{ inputs.manifest_sha256 }}",
            "JOURNAL_RUN": "${{ inputs.journal_run_id }}",
            "JOURNAL_ARTIFACT": "${{ inputs.journal_artifact_id }}",
            "MODE": "${{ inputs.mode }}"
          },
          "run": "set -euo pipefail\n[[ \"$SOURCE_RUN\" =~ ^[1-9][0-9]*$ && \"$ARTIFACT\" =~ ^[1-9][0-9]*$ ]]\n[[ \"$SOURCE_RUN\" == \"$SECRETKIT_APPROVED_SOURCE_RUN_ID\" && \"$ARTIFACT\" == \"$SECRETKIT_APPROVED_ARTIFACT_ID\" && \"$MANIFEST\" == \"$SECRETKIT_APPROVED_MANIFEST_SHA256\" ]]\n[[ \"$SECRETKIT_ENVIRONMENT_PROTECTED\" == true ]]\nif [[ \"$MODE\" == initial-admission ]]; then\n  [[ \"$SECRETKIT_APPROVED_JOURNAL_HEAD\" == new ]]\n  [[ -z \"$JOURNAL_RUN\" && -z \"$JOURNAL_ARTIFACT\" ]]\nelse\n  [[ \"$SECRETKIT_APPROVED_JOURNAL_HEAD\" =~ ^[0-9a-f]{64}$ && \"$JOURNAL_RUN\" =~ ^[1-9][0-9]*$ && \"$JOURNAL_ARTIFACT\" =~ ^[1-9][0-9]*$ ]]\nfi"
        },
        {
          "id": "original_admission",
          "env": {
            "ORIGINAL_ADMISSION": "${{ secrets.SECRETKIT_ORIGINAL_ADMISSION }}"
          },
          "run": "set -euo pipefail\n[[ \"$SECRETKIT_APPROVED_ORIGINAL_ADMISSION_SHA256\" =~ ^[0-9a-f]{64}$ ]]\nmkdir authorization\nprintf '%s' \"$ORIGINAL_ADMISSION\" > \"$SECRETKIT_ORIGINAL_ADMISSION_FILE\"\nprintf '%s  %s\\n' \"$SECRETKIT_APPROVED_ORIGINAL_ADMISSION_SHA256\" \"$SECRETKIT_ORIGINAL_ADMISSION_FILE\" | sha256sum --check --status"
        },
        {
          "uses": "actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9",
          "with": {
            "dotnet-version": "10.0.302"
          }
        },
        {
          "id": "runner_download",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "${{ needs.verify.outputs.runner_artifact_id }}",
            "path": "runner-artifact",
            "merge-multiple": true
          }
        },
        {
          "id": "runner_integrity",
          "env": {
            "RUNNER_HASH": "${{ needs.verify.outputs.runner_sha256 }}"
          },
          "run": "[[ \"$RUNNER_HASH\" =~ ^[0-9a-f]{64}$ ]]\nprintf \"%s  runner-artifact/runner.tar\\n\" \"$RUNNER_HASH\" | sha256sum --check --status\nmkdir runner\ntar -xf runner-artifact/runner.tar -C runner"
        },
        {
          "id": "artifact_download",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "${{ inputs.artifact_id }}",
            "run-id": "${{ inputs.source_run_id }}",
            "github-token": "${{ github.token }}",
            "repository": "islamu-ngo/SecretKit",
            "path": "bundle",
            "merge-multiple": true
          }
        },
        {
          "id": "artifact_metadata",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "SOURCE_RUN": "${{ inputs.source_run_id }}",
            "ARTIFACT": "${{ inputs.artifact_id }}",
            "SOURCE_COMMIT": "${{ vars.SECRETKIT_APPROVED_SOURCE_COMMIT }}",
            "EVIDENCE_INDEX": "${{ vars.SECRETKIT_APPROVED_EVIDENCE_INDEX }}"
          },
          "run": "set -euo pipefail\n[[ \"$SOURCE_COMMIT\" =~ ^[0-9a-f]{40}$ && \"$SECRETKIT_APPROVED_EVIDENCE_SHA256\" =~ ^[0-9a-f]{64}$ ]]\nmkdir independent-evidence report-archives\nprintf '%s' \"$EVIDENCE_INDEX\" > independent-evidence/evidence-index.json\nprintf '%s  independent-evidence/evidence-index.json\\n' \"$SECRETKIT_APPROVED_EVIDENCE_SHA256\" | sha256sum --check --status\njq -e --arg source \"$SOURCE_COMMIT\" --arg run \"$SOURCE_RUN\" '.schemaVersion == 1 and .kind == \"independent-release-evidence\" and .repository == \"islamu-ngo/SecretKit\" and .sourceCommit == $source and (.runId | tostring) == $run and (.reports | length) == 8' independent-evidence/evidence-index.json > /dev/null\nattempt=$(jq -er '.runAttempt' independent-evidence/evidence-index.json)\n[[ \"$attempt\" =~ ^[1-9][0-9]*$ ]]\ngh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$ARTIFACT\" > independent-evidence/artifact-metadata.json\ngh api \"repos/islamu-ngo/SecretKit/actions/runs/$SOURCE_RUN/attempts/$attempt\" > independent-evidence/run-metadata.json\nfor inventory in infisical azure-key-vault; do\n  gh api -H \"Accept: application/vnd.github.raw+json\" \"repos/islamu-ngo/SecretKit/contents/docs/internal/releases/admission/$inventory.json?ref=$SOURCE_COMMIT\" > \"independent-evidence/$inventory.json\"\ndone\ngh api -H \"Accept: application/vnd.github.raw+json\" \"repos/islamu-ngo/SecretKit/contents/THIRD-PARTY-NOTICES.md?ref=$SOURCE_COMMIT\" > independent-evidence/THIRD-PARTY-NOTICES.md\njq -er '.reports[] | [.artifactId, .jobId, .artifactDigest, .report.file, .report.sha256] | @tsv' independent-evidence/evidence-index.json > report-archives/fetch.tsv\nwhile IFS=$'\\t' read -r artifact job digest file report_hash; do\n  [[ \"$artifact\" =~ ^[1-9][0-9]*$ && \"$job\" =~ ^[1-9][0-9]*$ && \"$digest\" =~ ^[0-9a-f]{64}$ && \"$report_hash\" =~ ^[0-9a-f]{64}$ && \"$file\" == \"$artifact-report.json\" ]]\n  gh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$artifact\" > \"independent-evidence/$artifact-artifact.json\"\n  gh api \"repos/islamu-ngo/SecretKit/actions/jobs/$job\" > \"independent-evidence/$job-job.json\"\n  gh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$artifact/zip\" > \"report-archives/$artifact.zip\"\n  dotnet runner/SecretKit.Release.dll extract-report report-archives \"$artifact\" \"$digest\" independent-evidence\n  printf '%s  independent-evidence/%s\\n' \"$report_hash\" \"$file\" | sha256sum --check --status\ndone < report-archives/fetch.tsv"
        },
        {
          "id": "producer_job",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "SOURCE_RUN": "${{ inputs.source_run_id }}",
            "SOURCE_COMMIT": "${{ vars.SECRETKIT_APPROVED_SOURCE_COMMIT }}"
          },
          "run": "set -euo pipefail\nattempt=$(jq -er '.runAttempt' independent-evidence/evidence-index.json)\ngh api --paginate --slurp \"repos/islamu-ngo/SecretKit/actions/runs/$SOURCE_RUN/attempts/$attempt/jobs\" > independent-evidence/producer-jobs.json\njob=$(jq -er --argjson run \"$SOURCE_RUN\" --argjson attempt \"$attempt\" --arg sha \"$SOURCE_COMMIT\" '[.[].jobs[] | select(.name == \"candidate\" and .run_id == $run and .run_attempt == $attempt and .head_sha == $sha and .status == \"completed\" and .conclusion == \"success\")] | if length == 1 then .[0].id else error(\"producer-job-selection\") end' independent-evidence/producer-jobs.json)\n[[ \"$job\" =~ ^[1-9][0-9]*$ ]]\ngh api \"repos/islamu-ngo/SecretKit/actions/jobs/$job\" > independent-evidence/producer-job.json"
        },
        {
          "id": "journal_download",
          "if": "${{ inputs.mode != 'initial-admission' }}",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "${{ inputs.journal_artifact_id }}",
            "run-id": "${{ inputs.journal_run_id }}",
            "github-token": "${{ github.token }}",
            "repository": "islamu-ngo/SecretKit",
            "path": "journal",
            "merge-multiple": true
          }
        },
        {
          "id": "journal_metadata",
          "if": "${{ inputs.mode != 'initial-admission' }}",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "JOURNAL_RUN": "${{ inputs.journal_run_id }}",
            "JOURNAL_ARTIFACT": "${{ inputs.journal_artifact_id }}",
            "JOURNAL_DIGEST": "${{ vars.SECRETKIT_APPROVED_JOURNAL_ARTIFACT_DIGEST }}",
            "JOURNAL_SHA": "${{ vars.SECRETKIT_APPROVED_JOURNAL_WORKFLOW_COMMIT }}"
          },
          "run": "set -euo pipefail\n[[ \"$JOURNAL_DIGEST\" =~ ^[0-9a-f]{64}$ && \"$JOURNAL_SHA\" =~ ^[0-9a-f]{40}$ ]]\ngh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$JOURNAL_ARTIFACT\" > authorization/journal-artifact.json\njq -e --argjson id \"$JOURNAL_ARTIFACT\" --argjson run \"$JOURNAL_RUN\" --arg digest \"sha256:$JOURNAL_DIGEST\" --arg sha \"$JOURNAL_SHA\" '.id == $id and .expired == false and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $sha' authorization/journal-artifact.json > /dev/null\ngh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$JOURNAL_ARTIFACT/zip\" > authorization/journal.zip\nprintf '%s  authorization/journal.zip\\n' \"$JOURNAL_DIGEST\" | sha256sum --check --status"
        },
        {
          "id": "verify_artifacts",
          "run": "set -euo pipefail\nif [[ \"$SECRETKIT_VERIFY_PURPOSE\" == initial-admission ]]; then\n  dotnet runner/SecretKit.Release.dll verify bundle\nelse\n  dotnet runner/SecretKit.Release.dll verify bundle journal\nfi"
        },
        {
          "id": "initialize",
          "if": "${{ inputs.mode == 'initial-admission' }}",
          "run": "dotnet runner/SecretKit.Release.dll initialize bundle journal"
        },
        {
          "id": "reconcile",
          "if": "${{ inputs.mode == 'read-only-recovery' }}",
          "run": "dotnet runner/SecretKit.Release.dll reconcile bundle journal"
        },
        {
          "id": "observed_journal",
          "if": "${{ always() && (steps.initialize.outcome == 'success' || steps.reconcile.outcome == 'success' || steps.reconcile.outcome == 'failure') }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "journal-${{ github.run_id }}-${{ github.run_attempt }}-observed",
            "path": "journal/",
            "if-no-files-found": "error",
            "retention-days": 120
          }
        }
      ],
      "defaults": {
        "run": {
          "shell": "bash"
        }
      }
    },
    "publish_one": {
      "needs": "verify",
      "if": "${{ inputs.mode == 'publish-one' && inputs.execute && github.run_attempt == 1 && github.repository == 'islamu-ngo/SecretKit' && github.ref == 'refs/heads/main' && github.ref_protected }}",
      "environment": "release",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "permissions": {
        "contents": "read",
        "actions": "read",
        "id-token": "write"
      },
      "env": {
        "SECRETKIT_APPROVED_MANIFEST_SHA256": "${{ vars.SECRETKIT_APPROVED_MANIFEST_SHA256 }}",
        "SECRETKIT_APPROVED_SOURCE_COMMIT": "${{ vars.SECRETKIT_APPROVED_SOURCE_COMMIT }}",
        "SECRETKIT_APPROVED_VERSION": "${{ vars.SECRETKIT_APPROVED_VERSION }}",
        "SECRETKIT_APPROVED_SOURCE_RUN_ID": "${{ vars.SECRETKIT_APPROVED_SOURCE_RUN_ID }}",
        "SECRETKIT_APPROVED_ARTIFACT_ID": "${{ vars.SECRETKIT_APPROVED_ARTIFACT_ID }}",
        "SECRETKIT_APPROVED_ARTIFACT_DIGEST": "${{ vars.SECRETKIT_APPROVED_ARTIFACT_DIGEST }}",
        "SECRETKIT_APPROVED_SCOPE_SHA256": "${{ vars.SECRETKIT_APPROVED_SCOPE_SHA256 }}",
        "SECRETKIT_APPROVED_EVIDENCE_SHA256": "${{ vars.SECRETKIT_APPROVED_EVIDENCE_SHA256 }}",
        "SECRETKIT_EVIDENCE_DIRECTORY": "independent-evidence",
        "SECRETKIT_NUGET_USER": "${{ vars.SECRETKIT_NUGET_USER }}",
        "SECRETKIT_NUGET_OWNER": "${{ vars.SECRETKIT_NUGET_OWNER }}",
        "SECRETKIT_NUGET_REPOSITORY_CERT_SHA256": "${{ vars.SECRETKIT_NUGET_REPOSITORY_CERT_SHA256 }}",
        "SECRETKIT_APPROVED_JOURNAL_HEAD": "${{ vars.SECRETKIT_APPROVED_JOURNAL_HEAD }}",
        "SECRETKIT_ENVIRONMENT_PROTECTED": "${{ vars.SECRETKIT_ENVIRONMENT_PROTECTED }}",
        "SECRETKIT_ENVIRONMENT": "release",
        "SECRETKIT_ORIGINAL_ADMISSION_FILE": "authorization/original-admission.json",
        "SECRETKIT_APPROVED_ORIGINAL_ADMISSION_SHA256": "${{ vars.SECRETKIT_APPROVED_ORIGINAL_ADMISSION_SHA256 }}",
        "SECRETKIT_VERIFY_PURPOSE": "read-only-recovery",
        "SECRETKIT_ACTION_AUTHORIZATION_FILE": "authorization/action.json",
        "SECRETKIT_APPROVED_ACTION_AUTHORIZATION_SHA256": "${{ vars.SECRETKIT_APPROVED_ACTION_AUTHORIZATION_SHA256 }}",
        "SECRETKIT_EXECUTE": "${{ inputs.execute }}"
      },
      "steps": [
        {
          "id": "input_gate",
          "name": "Bind inputs to protected approvals",
          "env": {
            "SOURCE_RUN": "${{ inputs.source_run_id }}",
            "ARTIFACT": "${{ inputs.artifact_id }}",
            "MANIFEST": "${{ inputs.manifest_sha256 }}",
            "JOURNAL_RUN": "${{ inputs.journal_run_id }}",
            "JOURNAL_ARTIFACT": "${{ inputs.journal_artifact_id }}",
            "MODE": "${{ inputs.mode }}"
          },
          "run": "set -euo pipefail\n[[ \"$SOURCE_RUN\" =~ ^[1-9][0-9]*$ && \"$ARTIFACT\" =~ ^[1-9][0-9]*$ ]]\n[[ \"$SOURCE_RUN\" == \"$SECRETKIT_APPROVED_SOURCE_RUN_ID\" && \"$ARTIFACT\" == \"$SECRETKIT_APPROVED_ARTIFACT_ID\" && \"$MANIFEST\" == \"$SECRETKIT_APPROVED_MANIFEST_SHA256\" ]]\n[[ \"$SECRETKIT_ENVIRONMENT_PROTECTED\" == true ]]\nif [[ \"$MODE\" == initial-admission ]]; then\n  [[ \"$SECRETKIT_APPROVED_JOURNAL_HEAD\" == new ]]\n  [[ -z \"$JOURNAL_RUN\" && -z \"$JOURNAL_ARTIFACT\" ]]\nelse\n  [[ \"$SECRETKIT_APPROVED_JOURNAL_HEAD\" =~ ^[0-9a-f]{64}$ && \"$JOURNAL_RUN\" =~ ^[1-9][0-9]*$ && \"$JOURNAL_ARTIFACT\" =~ ^[1-9][0-9]*$ ]]\nfi"
        },
        {
          "id": "original_admission",
          "env": {
            "ORIGINAL_ADMISSION": "${{ secrets.SECRETKIT_ORIGINAL_ADMISSION }}"
          },
          "run": "set -euo pipefail\n[[ \"$SECRETKIT_APPROVED_ORIGINAL_ADMISSION_SHA256\" =~ ^[0-9a-f]{64}$ ]]\nmkdir authorization\nprintf '%s' \"$ORIGINAL_ADMISSION\" > \"$SECRETKIT_ORIGINAL_ADMISSION_FILE\"\nprintf '%s  %s\\n' \"$SECRETKIT_APPROVED_ORIGINAL_ADMISSION_SHA256\" \"$SECRETKIT_ORIGINAL_ADMISSION_FILE\" | sha256sum --check --status"
        },
        {
          "uses": "actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9",
          "with": {
            "dotnet-version": "10.0.302"
          }
        },
        {
          "id": "runner_download",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "${{ needs.verify.outputs.runner_artifact_id }}",
            "path": "runner-artifact",
            "merge-multiple": true
          }
        },
        {
          "id": "runner_integrity",
          "env": {
            "RUNNER_HASH": "${{ needs.verify.outputs.runner_sha256 }}"
          },
          "run": "[[ \"$RUNNER_HASH\" =~ ^[0-9a-f]{64}$ ]]\nprintf \"%s  runner-artifact/runner.tar\\n\" \"$RUNNER_HASH\" | sha256sum --check --status\nmkdir runner\ntar -xf runner-artifact/runner.tar -C runner"
        },
        {
          "id": "artifact_download",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "${{ inputs.artifact_id }}",
            "run-id": "${{ inputs.source_run_id }}",
            "github-token": "${{ github.token }}",
            "repository": "islamu-ngo/SecretKit",
            "path": "bundle",
            "merge-multiple": true
          }
        },
        {
          "id": "artifact_metadata",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "SOURCE_RUN": "${{ inputs.source_run_id }}",
            "ARTIFACT": "${{ inputs.artifact_id }}",
            "SOURCE_COMMIT": "${{ vars.SECRETKIT_APPROVED_SOURCE_COMMIT }}",
            "EVIDENCE_INDEX": "${{ vars.SECRETKIT_APPROVED_EVIDENCE_INDEX }}"
          },
          "run": "set -euo pipefail\n[[ \"$SOURCE_COMMIT\" =~ ^[0-9a-f]{40}$ && \"$SECRETKIT_APPROVED_EVIDENCE_SHA256\" =~ ^[0-9a-f]{64}$ ]]\nmkdir independent-evidence report-archives\nprintf '%s' \"$EVIDENCE_INDEX\" > independent-evidence/evidence-index.json\nprintf '%s  independent-evidence/evidence-index.json\\n' \"$SECRETKIT_APPROVED_EVIDENCE_SHA256\" | sha256sum --check --status\njq -e --arg source \"$SOURCE_COMMIT\" --arg run \"$SOURCE_RUN\" '.schemaVersion == 1 and .kind == \"independent-release-evidence\" and .repository == \"islamu-ngo/SecretKit\" and .sourceCommit == $source and (.runId | tostring) == $run and (.reports | length) == 8' independent-evidence/evidence-index.json > /dev/null\nattempt=$(jq -er '.runAttempt' independent-evidence/evidence-index.json)\n[[ \"$attempt\" =~ ^[1-9][0-9]*$ ]]\ngh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$ARTIFACT\" > independent-evidence/artifact-metadata.json\ngh api \"repos/islamu-ngo/SecretKit/actions/runs/$SOURCE_RUN/attempts/$attempt\" > independent-evidence/run-metadata.json\nfor inventory in infisical azure-key-vault; do\n  gh api -H \"Accept: application/vnd.github.raw+json\" \"repos/islamu-ngo/SecretKit/contents/docs/internal/releases/admission/$inventory.json?ref=$SOURCE_COMMIT\" > \"independent-evidence/$inventory.json\"\ndone\ngh api -H \"Accept: application/vnd.github.raw+json\" \"repos/islamu-ngo/SecretKit/contents/THIRD-PARTY-NOTICES.md?ref=$SOURCE_COMMIT\" > independent-evidence/THIRD-PARTY-NOTICES.md\njq -er '.reports[] | [.artifactId, .jobId, .artifactDigest, .report.file, .report.sha256] | @tsv' independent-evidence/evidence-index.json > report-archives/fetch.tsv\nwhile IFS=$'\\t' read -r artifact job digest file report_hash; do\n  [[ \"$artifact\" =~ ^[1-9][0-9]*$ && \"$job\" =~ ^[1-9][0-9]*$ && \"$digest\" =~ ^[0-9a-f]{64}$ && \"$report_hash\" =~ ^[0-9a-f]{64}$ && \"$file\" == \"$artifact-report.json\" ]]\n  gh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$artifact\" > \"independent-evidence/$artifact-artifact.json\"\n  gh api \"repos/islamu-ngo/SecretKit/actions/jobs/$job\" > \"independent-evidence/$job-job.json\"\n  gh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$artifact/zip\" > \"report-archives/$artifact.zip\"\n  dotnet runner/SecretKit.Release.dll extract-report report-archives \"$artifact\" \"$digest\" independent-evidence\n  printf '%s  independent-evidence/%s\\n' \"$report_hash\" \"$file\" | sha256sum --check --status\ndone < report-archives/fetch.tsv"
        },
        {
          "id": "producer_job",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "SOURCE_RUN": "${{ inputs.source_run_id }}",
            "SOURCE_COMMIT": "${{ vars.SECRETKIT_APPROVED_SOURCE_COMMIT }}"
          },
          "run": "set -euo pipefail\nattempt=$(jq -er '.runAttempt' independent-evidence/evidence-index.json)\ngh api --paginate --slurp \"repos/islamu-ngo/SecretKit/actions/runs/$SOURCE_RUN/attempts/$attempt/jobs\" > independent-evidence/producer-jobs.json\njob=$(jq -er --argjson run \"$SOURCE_RUN\" --argjson attempt \"$attempt\" --arg sha \"$SOURCE_COMMIT\" '[.[].jobs[] | select(.name == \"candidate\" and .run_id == $run and .run_attempt == $attempt and .head_sha == $sha and .status == \"completed\" and .conclusion == \"success\")] | if length == 1 then .[0].id else error(\"producer-job-selection\") end' independent-evidence/producer-jobs.json)\n[[ \"$job\" =~ ^[1-9][0-9]*$ ]]\ngh api \"repos/islamu-ngo/SecretKit/actions/jobs/$job\" > independent-evidence/producer-job.json"
        },
        {
          "id": "journal_download",
          "if": "${{ inputs.mode != 'initial-admission' }}",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "${{ inputs.journal_artifact_id }}",
            "run-id": "${{ inputs.journal_run_id }}",
            "github-token": "${{ github.token }}",
            "repository": "islamu-ngo/SecretKit",
            "path": "journal",
            "merge-multiple": true
          }
        },
        {
          "id": "journal_metadata",
          "if": "${{ inputs.mode != 'initial-admission' }}",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "JOURNAL_RUN": "${{ inputs.journal_run_id }}",
            "JOURNAL_ARTIFACT": "${{ inputs.journal_artifact_id }}",
            "JOURNAL_DIGEST": "${{ vars.SECRETKIT_APPROVED_JOURNAL_ARTIFACT_DIGEST }}",
            "JOURNAL_SHA": "${{ vars.SECRETKIT_APPROVED_JOURNAL_WORKFLOW_COMMIT }}"
          },
          "run": "set -euo pipefail\n[[ \"$JOURNAL_DIGEST\" =~ ^[0-9a-f]{64}$ && \"$JOURNAL_SHA\" =~ ^[0-9a-f]{40}$ ]]\ngh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$JOURNAL_ARTIFACT\" > authorization/journal-artifact.json\njq -e --argjson id \"$JOURNAL_ARTIFACT\" --argjson run \"$JOURNAL_RUN\" --arg digest \"sha256:$JOURNAL_DIGEST\" --arg sha \"$JOURNAL_SHA\" '.id == $id and .expired == false and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $sha' authorization/journal-artifact.json > /dev/null\ngh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$JOURNAL_ARTIFACT/zip\" > authorization/journal.zip\nprintf '%s  authorization/journal.zip\\n' \"$JOURNAL_DIGEST\" | sha256sum --check --status"
        },
        {
          "id": "verify_artifacts",
          "run": "dotnet runner/SecretKit.Release.dll verify bundle journal"
        },
        {
          "id": "action_authorization",
          "env": {
            "ACTION_AUTHORIZATION": "${{ secrets.SECRETKIT_ACTION_AUTHORIZATION }}"
          },
          "run": "set -euo pipefail\n[[ \"$SECRETKIT_APPROVED_ACTION_AUTHORIZATION_SHA256\" =~ ^[0-9a-f]{64}$ ]]\nprintf '%s' \"$ACTION_AUTHORIZATION\" > \"$SECRETKIT_ACTION_AUTHORIZATION_FILE\"\nprintf '%s  %s\\n' \"$SECRETKIT_APPROVED_ACTION_AUTHORIZATION_SHA256\" \"$SECRETKIT_ACTION_AUTHORIZATION_FILE\" | sha256sum --check --status"
        },
        {
          "id": "prepare",
          "env": {
            "PACKAGE_ID": "${{ inputs.package_id }}"
          },
          "run": "dotnet runner/SecretKit.Release.dll prepare bundle journal \"$PACKAGE_ID\""
        },
        {
          "id": "before",
          "if": "${{ steps.prepare.outputs.ready == 'true' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "publication-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-before",
            "path": "journal/",
            "if-no-files-found": "error",
            "retention-days": 120
          }
        },
        {
          "id": "checkpoint_metadata",
          "if": "${{ steps.prepare.outputs.ready == 'true' }}",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "CHECKPOINT_ID": "${{ steps.before.outputs.artifact-id }}",
            "CHECKPOINT_DIGEST": "${{ steps.before.outputs.artifact-digest }}"
          },
          "run": "set -euo pipefail\n[[ \"$CHECKPOINT_ID\" =~ ^[1-9][0-9]*$ && \"$CHECKPOINT_DIGEST\" =~ ^[0-9a-f]{64}$ ]]\ngh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$CHECKPOINT_ID\" > authorization/checkpoint-artifact.json\njq -e --argjson id \"$CHECKPOINT_ID\" --argjson run \"$GITHUB_RUN_ID\" --arg sha \"$GITHUB_SHA\" --arg digest \"sha256:$CHECKPOINT_DIGEST\" --arg name \"publication-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-before\" '.id == $id and .expired == false and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $sha and .name == $name' authorization/checkpoint-artifact.json > /dev/null\ngh api \"repos/islamu-ngo/SecretKit/actions/artifacts/$CHECKPOINT_ID/zip\" > authorization/checkpoint.zip\nprintf '%s  authorization/checkpoint.zip\\n' \"$CHECKPOINT_DIGEST\" | sha256sum --check --status"
        },
        {
          "id": "login",
          "uses": "NuGet/login@8d196754b4036150537f80ac539e15c2f1028841",
          "with": {
            "user": "${{ vars.SECRETKIT_NUGET_USER }}"
          },
          "if": "${{ steps.prepare.outputs.ready == 'true' }}"
        },
        {
          "id": "dispatch",
          "if": "${{ steps.prepare.outputs.ready == 'true' }}",
          "env": {
            "PACKAGE_ID": "${{ inputs.package_id }}",
            "NUGET_API_KEY": "${{ steps.login.outputs.NUGET_API_KEY }}",
            "SECRETKIT_CHECKPOINT_ARTIFACT_ID": "${{ steps.before.outputs.artifact-id }}",
            "SECRETKIT_CHECKPOINT_ARTIFACT_DIGEST": "${{ steps.before.outputs.artifact-digest }}",
            "SECRETKIT_CHECKPOINT_HEAD": "${{ steps.prepare.outputs.head }}",
            "SECRETKIT_CHECKPOINT_METADATA_FILE": "authorization/checkpoint-artifact.json"
          },
          "run": "dotnet runner/SecretKit.Release.dll dispatch bundle journal \"$PACKAGE_ID\" --execute"
        },
        {
          "id": "after",
          "if": "${{ always() && steps.dispatch.outcome != 'skipped' && steps.prepare.outputs.ready == 'true' }}",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "journal-${{ github.run_id }}-${{ github.run_attempt }}-after",
            "path": "journal/",
            "if-no-files-found": "error",
            "retention-days": 120
          }
        }
      ],
      "defaults": {
        "run": {
          "shell": "bash"
        }
      }
    }
  }
}
